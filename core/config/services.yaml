# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Обработчики команд/запросов регистрируются на своей шине по маркер-интерфейсу.
    _instanceof:
        App\Shared\Application\Bus\Command\CommandHandler:
            tags: [{ name: messenger.message_handler, bus: command.bus }]
        App\Shared\Application\Bus\Query\QueryHandler:
            tags: [{ name: messenger.message_handler, bus: query.bus }]
        # Подписчики доменных событий (межконтекстная связь — только через события)
        App\Shared\Application\Event\EventSubscriber:
            tags: [{ name: messenger.message_handler, bus: event.bus }]

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/**/Domain/'
            - '../src/**/Application/{Command,Query}/**/*{Command,Query,Result}.php'

# В тестах внешние сервисы (gRPC) подменяются in-memory реализациями портов.
when@test:
    services:
        # _instanceof не действует на when@test-блок — тег явно
        App\Tests\Shared\Infrastructure\Bus\RecordingSubscriber:
            public: true
            tags: [{ name: messenger.message_handler, bus: event.bus }]
        App\Shared\Application\Event\EventBus:
            alias: App\Shared\Infrastructure\Bus\MessengerEventBus
            public: true
        App\Tests\Fake\InMemoryPingGateway: ~
        App\Tests\Fake\InMemoryTelegramNotifier: ~
        App\Ping\Application\Port\PingGateway: '@App\Tests\Fake\InMemoryPingGateway'
        App\Notification\Application\Port\TelegramNotifier: '@App\Tests\Fake\InMemoryTelegramNotifier'
