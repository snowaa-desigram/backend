# Контроль зависимостей между слоями DDD: vendor/bin/deptrac
# Границы между контекстами (A не импортирует B) — tests/Architecture/ContextIsolationTest.php
deptrac:
  paths:
    - ./src
  exclude_files:
    - '#.*Kernel\.php#'
  layers:
    - name: Domain
      collectors:
        - type: directory
          value: src/.*/Domain/.*
    - name: Application
      collectors:
        - type: directory
          value: src/.*/Application/.*
    - name: Infrastructure
      collectors:
        - type: directory
          value: src/.*/Infrastructure/.*
    - name: Presentation
      collectors:
        - type: directory
          value: src/.*/Presentation/.*
  ruleset:
    Domain: ~
    Application: [Domain]
    Infrastructure: [Domain, Application]
    Presentation: [Application]
