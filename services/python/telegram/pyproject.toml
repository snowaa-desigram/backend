[project]
name = "telegram-service"
version = "0.1.0"
description = "Desigram Telegram gRPC microservice"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "desigram-common",
]

[project.scripts]
telegram-service = "telegram_service.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["telegram_service"]
