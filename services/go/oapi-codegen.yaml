# Go-типы из backend/openapi/auth.yaml. Генерация: make openapi (из корня монорепы)
package: authapi
output: gen/openapi/auth/types.gen.go
generate:
  models: true
output-options:
  skip-prune: true
# общие компоненты (Error) — отдельный пакет gen/openapi/common, см. oapi-codegen.common.yaml
import-mapping:
  common.yaml: github.com/snowaa-desigram/backend/services/go/gen/openapi/common
