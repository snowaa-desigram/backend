version: "2"

linters:
  default: standard
  enable:
    - depguard
  settings:
    depguard:
      rules:
        # Архитектурные правила
        main:
          deny:
            - pkg: github.com/rookie-ninja
              desc: "каркас — go-zero, rk-boot не используем"
            - pkg: "log$"
              desc: "используй logx из go-zero"
  exclusions:
    paths:
      - gen/

formatters:
  enable:
    - gofmt
